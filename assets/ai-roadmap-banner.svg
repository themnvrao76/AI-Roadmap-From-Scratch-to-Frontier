<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.45" stop-color="#111A33"/>
      <stop offset="1" stop-color="#07111A"/>
      <animate attributeName="x1" values="0;200;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7F9"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="120" cy="85" r="4" fill="#6EE7F9" opacity=".7">
    <animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1290" cy="85" r="4" fill="#22C55E" opacity=".7">
    <animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1210" cy="345" r="3" fill="#8B5CF6" opacity=".8">
    <animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="700" y="104" text-anchor="middle" fill="#EAF2FF" font-size="50" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    AI ROADMAP
  </text>
  <text x="700" y="150" text-anchor="middle" fill="#A8B6D8" font-size="23" font-family="Arial, Helvetica, sans-serif">
    From Scratch to Frontier
  </text>

  <line x1="170" y1="260" x2="1230" y2="260" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <circle cx="190" cy="260" r="18" fill="#0B1020" stroke="#6EE7F9" stroke-width="4"/>
      <text x="190" y="316" fill="#C8D4EE" font-size="17">FOUNDATIONS</text>
    </g>
    <g>
      <circle cx="400" cy="260" r="18" fill="#0B1020" stroke="#67E8F9" stroke-width="4"/>
      <text x="400" y="316" fill="#C8D4EE" font-size="17">MACHINE LEARNING</text>
    </g>
    <g>
      <circle cx="610" cy="260" r="18" fill="#0B1020" stroke="#A78BFA" stroke-width="4"/>
      <text x="610" y="316" fill="#C8D4EE" font-size="17">DEEP LEARNING</text>
    </g>
    <g>
      <circle cx="820" cy="260" r="18" fill="#0B1020" stroke="#C084FC" stroke-width="4"/>
      <text x="820" y="316" fill="#C8D4EE" font-size="17">TRANSFORMERS</text>
    </g>
    <g>
      <circle cx="1030" cy="260" r="18" fill="#0B1020" stroke="#4ADE80" stroke-width="4"/>
      <text x="1030" y="316" fill="#C8D4EE" font-size="17">LLMs + MULTIMODAL</text>
    </g>
    <g>
      <circle cx="1220" cy="260" r="18" fill="#0B1020" stroke="#22C55E" stroke-width="4"/>
      <text x="1220" y="316" fill="#C8D4EE" font-size="17">FRONTIER AI</text>
    </g>
  </g>

  <text x="700" y="375" text-anchor="middle" fill="#7483A6" font-size="16" font-family="Arial, Helvetica, sans-serif">
    Build • Read • Reproduce • Research
  </text>
</svg>